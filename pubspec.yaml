name: place_picker_google
description: "A place picker package for google maps api fully written in dart for Flutter."
homepage: https://github.com/joafc96/place_picker_google
repository: https://github.com/joafc96/place_picker_google
issue_tracker: https://github.com/joafc96/place_picker_google/issues
documentation: https://github.com/joafc96/place_picker_google/blob/main/README.md
version: 0.3.2

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  google_maps_flutter: ^2.19.0
  geolocator: ^14.0.2
  geocoding: ^5.0.1
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

topics:
  - map-picker
  - location-picker
  - flutter-location-picker
  - google-maps-flutter
  - place-picker